# Agreed meanings of acquisition-metadata quantities.
#
# Extracted once from the raw MATLAB structVar metadata and the acquisition
# notes so that scripts and figures use these mappings instead of re-deriving
# them per task. Sources: DATA/26-07-31-single-sweep/ (raw, git-ignored) and
# its README.txt.

[conditions.central_dot_strength]
# structVar field carrying the central-dot strength that defines the conditions.
field = "ZeroOrderPowerRatio"
# Recorded values in the 2026-07-31 batch -> derived conditions
# central_dot_0p05 and central_dot_0p18.
values = [0.05, 0.18]

[streak_camera.axes]
# Streak frame layout: the vertical axis is time; the horizontal axis is plain
# detector pixels and needs no coordinate transform.
vertical_axis = "time"
horizontal_axis = "detector_pixels"
# Axis indices in the derived frames datasets (frames[acquisition_frame, y, x]).
time_axis_index = 1
pixel_axis_index = 2

[streak_camera.time_range]
# structVar field carrying the HPD-TA "Time Range" device setting. The setting
# is device-enumerated (an index into the sweep unit's range list), so the
# actual window is taken from the acquisition notes, not from the raw number.
field = "StreakRange"
device_setting = 5
# Time window spanned by the full vertical frame, from the acquisition notes.
window_ns = 1.0
window_source = "DATA/26-07-31-single-sweep/README.txt: 'Scan of 1 ns window'"
# 2026-07-31 batch: 1016 vertical pixels span 1 ns -> ~0.984 ps/px.

[streak_camera.time_range_0804]
# 2026-08-04 batch (DATA/26-08-04-hbt-time-reference): StreakRange = 5 in every
# folder; the device-enumerated index does not encode the window by itself and
# maps to different windows on the two sweep modules. Mode indicator:
# structVar/TGFrequency (4 = synchroscan module, 100 = single-sweep module),
# matching the mode notes in "DATA/26-08-04-hbt-time-reference/New Text
# Document.txt" (items 2-6 in synchroscan mode, 8-9 after "Go back to single
# sweep module"; 01 groups with single sweep by TGFrequency).
synchroscan_window_ns = 2.0
synchroscan_window_source = "user verification 2026-08-07: 02_Synchroscan_Kspace_image first, 03-06 confirmed the same day"
synchroscan_folders = [
  "02_Synchroscan_Kspace_image",
  "03_Synchroscan_real_space_image",
  "04_Real_space_no_pulse_intensity_calibration",
  "05_Kspace_no_pulse_intensity_calibration",
  "06_Background_image_synchroscan_mode",
]
single_sweep_window_ns = 1.0
single_sweep_window_source = "26-07-31 single-sweep notes at the same StreakRange = 5 (see [streak_camera.time_range]); 1016 px -> ~0.984 ps/px"
single_sweep_folders = [
  "01_HBT_condensate_Josephson_regime",
  "08_Focus_cross_sections",
  "09_Background_and_streak_pulses_delay_calibration",
]
